spring.application.name=electronic
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.level.com.example.electronic.DatabaseConnectionChecker=INFO


# ============================================
# MySQL Database Configuration
# ============================================
# IMPORTANT: If you get "Access denied for user 'root'@'localhost' (using password: NO)" error:
# 1. If your MySQL root user has a password, set it here: spring.datasource.password=your_password
# 2. If your MySQL root user has NO password, you may need to configure MySQL to allow it:
#    Run in MySQL Workbench: ALTER USER 'root'@'localhost' IDENTIFIED BY '';
# 3. Or create a new MySQL user for this application (recommended)
# ============================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shopquanao?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=111111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP connection pool settings for better resilience
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.initialization-fail-timeout=-1
# Disable automatic SQL script execution - manage database manually in SQL Workbench
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Allow application to start even if database connection fails temporarily
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

server.port=8080
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true


