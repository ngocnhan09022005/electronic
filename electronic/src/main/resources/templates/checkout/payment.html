<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - Clothify</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="hero small">
    <div class="hero-content">
        <p class="eyebrow">Thanh toán điện tử</p>
        <h1>Hoàn tất đơn hàng của bạn</h1>
    </div>
</header>

<section class="section">
    <div class="checkout">
        <!-- Checkout Form -->
        <div class="card">
            <h2 style="margin-bottom: 1.5rem;">Thông tin khách hàng</h2>
            
            <div th:if="${error}" class="alert error" th:text="${error}"></div>
            
            <form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post">
                <label>
                    Họ tên *
                    <input type="text" th:field="*{customerName}" placeholder="Nguyễn Văn A" required>
                </label>
                
                <label>
                    Email
                    <input type="email" th:field="*{email}" placeholder="ban@example.com">
                </label>
                
                <label>
                    Số điện thoại *
                    <input type="tel" th:field="*{phone}" placeholder="090 xxx xxxx" required>
                </label>

                <h2 style="margin-top: 2rem; margin-bottom: 1rem;">Chọn phương thức thanh toán *</h2>
                <select th:field="*{paymentMethod}" required style="margin-bottom: 1.5rem;">
                    <option value="">-- Chọn phương thức --</option>
                    <option th:each="method : ${paymentMethods}"
                            th:value="${method}"
                            th:text="${method.displayName}">Thẻ</option>
                </select>

                <div th:if="${#fields.hasErrors('*')}" class="alert error">
                    <p>Vui lòng kiểm tra lại thông tin đã nhập.</p>
                </div>

                <button class="btn secondary" type="submit" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem;">
                    Tạo đơn hàng
                </button>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="card">
            <h2 style="margin-bottom: 1.5rem;">Đơn hàng của bạn</h2>
            
            <div class="table">
                <table>
                    <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cartItem : ${cartItems}">
                        <td>
                            <strong th:text="${cartItem.item.name}">Tên sản phẩm</strong><br>
                            <small style="color: var(--gray-600);" th:text="${cartItem.item.description}">Mô tả</small>
                        </td>
                        <td th:text="${cartItem.quantity}">1</td>
                        <td th:text="${#numbers.formatDecimal(cartItem.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr style="background: var(--gray-50); font-weight: 700;">
                        <td colspan="2" style="text-align: right; padding: 1.5rem;">Tổng cộng:</td>
                        <td style="font-size: 1.5rem; color: var(--primary-red); padding: 1.5rem;" 
                            th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                    </tr>
                    </tfoot>
                </table>
            </div>
            
            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200);">
                <a th:href="@{/cart}" class="btn ghost" style="width: 100%; text-align: center; color: var(--primary-red); border-color: var(--primary-red);">
                    ← Quay lại giỏ hàng
                </a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
