<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lỗi - Clothify</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .error-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 2rem;
            text-align: center;
        }
        .error-container h1 {
            font-size: 3rem;
            color: #c33;
            margin-bottom: 1rem;
        }
        .error-container h2 {
            color: #666;
            margin-bottom: 1rem;
        }
        .error-container p {
            margin-bottom: 2rem;
            color: #999;
        }
        .error-container .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #006;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin: 0 0.5rem;
        }
        .error-container .btn:hover {
            background: #004;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1 th:text="${status != null ? status : '404'}">404</h1>
    <h2 th:text="${error != null ? error : 'Không tìm thấy trang'}">Không tìm thấy trang</h2>
    <p th:text="${message != null ? message : 'Trang bạn đang tìm kiếm không tồn tại.'}">
        Trang bạn đang tìm kiếm không tồn tại.
    </p>
    <div>
        <a class="btn" th:href="@{/shop/home}">Về trang chủ</a>
        <a class="btn" href="javascript:history.back()">Quay lại</a>
    </div>
</div>
</body>
</html>
